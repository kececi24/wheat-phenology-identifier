# Run from repository root. Paths are relative to the working directory.
label_path: labeling_bbch_iso_dates.csv
data_path: data
out_dir: results_adapter_bbch_blocks_025
image_backbone: facebook/dinov3-vitb16-pretrain-lvd1689m
backbone_revision: null
stream: micro
camera: AUTO
transition_days: 2
ignore_status_csv: false

# Fixed fold assignments across label budgets and training-seed repeats.
fold_id: 0
validation_groups: 2
expected_stations: null
fold_seed: 42
seed: 42
label_seed: 42

methods: [none, lora, standard, transition]
last_blocks: 2
# With Q/V LoRA, lora_rank = rank / 2 matches trainable adapter weights.
rank: 6
lora_rank: 3
lora_alpha: 3.0
prior_lambda: 0.01
min_stage_images: 2
min_transition_stations: 2
label_percentage: 25
hidden_dim: 128
dropout: 0.2

# Raw-image inputs, no final-embedding cache. Registers excluded from pooling.
dense_grid_size: 2
image_size: 224
tile_size: 224
tile_stride: 112
max_tiles: 8
tile_batch_size: 8
augment: false

lr: 3.0e-4
weight_decay: 3.0e-4
epochs: 20
patience: 5
batch_size: 2
accumulation_steps: 8
num_workers: 4
ordinal_ce_weight: 0.5
device: cuda
amp: none  # Optional: bf16 on supported GPUs, or fp16 with gradient scaling.
dry_run: false
