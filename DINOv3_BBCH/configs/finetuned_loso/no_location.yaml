# One complete fine-tuning -> cache -> temporal LOSO experiment.
# Copy this file and change result_root for each experiment.
pipeline:
  label_path: labeling_truncated3.csv
  data_path: data
  result_root: results_dinov3_finetuned_loso
  image_backbone: facebook/dinov3-vitb16-pretrain-lvd1689m
  expected_stations: 15
  fold_start: 1
  fold_end: 15
  validation_groups: 2
  fold_seed: 42
  seed: 42
  stream: micro
  camera: AUTO
  exclude_offseason: true
  gpu_id: 0
  keep_caches: false
finetune:
  epochs: 8
  batch_size: 1
  accumulation_steps: 8
  unfreeze_last_blocks: 1
  backbone_lr: 2.0e-06
  head_lr: 0.0001
  weight_decay: 0.01
  dropout: 0.2
  tile_size: 224
  tile_stride: 224
  max_tiles: 16
  vit_image_size: 224
  dense_grid_size: 2
  dense_include_cls: true
  ordinal_ce_weight: 0.5
  num_workers: 4
precompute:
  tile_streams: micro
  tile_pooling: attention
  tile_size: 224
  tile_stride: 112
  max_tiles: 0
  vit_image_size: 224
  dense_features: true
  dense_grid_size: 2
  dense_include_cls: true
  embedding_dtype: float16
  batch_size: 256
  image_batch_size: 16
  num_workers: 8
  prefetch_factor: 4
training:
  epochs: 30
  window_days: 21
  window_mode: causal
  date_tolerance_days: 5
  min_train_stage_days: 8
  min_train_window_coverage_days: 12
  batch_size: 32
  accumulation_steps: 1
  num_workers: 2
  temporal_model: transformer
  temporal_aggregation: cls
  temporal_layers: 2
  temporal_heads: 8
  temporal_norm_first: true
  temporal_ffn_multiplier: 2
  loss: hybrid
  ordinal_ce_weight: 0.5
  checkpoint_metric: macro_f1
  dropout: 0.2
  weight_decay: 0.0003
  lr: 0.0001
  lr_scheduler: cosine
  warmup_ratio: 0.05
  use_days_since_planting: true
  temporal_feature_fusion: gated
  temporal_feature_hidden_dim: 32
  temporal_feature_gate_init: 0.1
  use_location_metadata: false
  location_feature_hidden_dim: 16
  location_gate_init: 0.1
  monotonic_decoding: none
  log_interval: 50
  epoch_jsonl: false