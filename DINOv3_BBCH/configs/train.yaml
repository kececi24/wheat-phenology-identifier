# Main temporal training pipeline. Paths are relative to the working directory.
label_path: labeling_bbch_iso_dates.csv
data_path: data
out_dir: results_dinov3_bbch
embedding_cache: results_dinov3_bbch_cache/vit_embeddings.pt
epochs: 30
folds: 8
fold_group_by: station
validation_groups: 2
test_groups: 2
fold_seed: 42
seed: 42
window_days: 31
window_mode: causal
min_train_stage_days: 8
min_train_window_coverage_days: 12
stream: micro
camera: AUTO
batch_size: 16
accumulation_steps: 2
num_workers: 4
temporal_model: transformer
temporal_aggregation: cls
temporal_layers: 2
temporal_heads: 8
temporal_norm_first: true
temporal_ffn_multiplier: 2.0
loss: hybrid
ordinal_ce_weight: 0.5
checkpoint_metric: macro_f1
dropout: 0.2
weight_decay: 0.0003
lr: 0.0001
lr_scheduler: cosine
warmup_ratio: 0.05
use_days_since_planting: true
temporal_feature_fusion: legacy
use_location_metadata: true
location_feature_hidden_dim: 16
location_gate_init: 0.1
exclude_offseason: true
monotonic_decoding: none
device: cuda
log_interval: 50
# Set true to write fold_<n>/epochs.jsonl after each epoch.
epoch_jsonl: false
