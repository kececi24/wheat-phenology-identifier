# Main temporal training pipeline. Paths are relative to the working directory.
label_path: labeling_truncated2.csv
data_path: data
out_dir: results_dinov3_bbch_loso
embedding_cache: results_dinov3_bbch/vit_embeddings.pt
fold_strategy: loso
fold_group_by: station
expected_stations: 15
validation_groups: 2
test_groups: 1
fold_seed: 42
epochs: 20
window_days: 21
window_mode: causal
date_tolerance_days: 5
min_train_stage_days: 8
min_train_window_coverage_days: 12
stream: micro
batch_size: 32
temporal_model: transformer
temporal_aggregation: cls
temporal_layers: 2
temporal_heads: 8
loss: hybrid
ordinal_ce_weight: 0.5
checkpoint_metric: macro_f1
dropout: 0.2
weight_decay: 0.0003
use_days_since_planting: true
temporal_feature_fusion: gated
use_location_metadata: false
exclude_offseason: true
device: cuda
