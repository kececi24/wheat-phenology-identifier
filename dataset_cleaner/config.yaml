data:
  root: "../data"
  trusted_folders:
    - "01.01/2015/K1/1X"
    - "01.01/2015/K1/10X"
    - "02.03/2014/K1/10X"
    - "02.03/2014/K1/1X"
    - "02.02/2015/K1/1X"
    - "02.02/2015/K1/10X"
    - "02.04/2014/K1/1X"
    - "02.04/2014/K1/10X"
    - "02.05/2014/K1/1X"
    - "02.05/2014/K1/10X"
    - "02.06/2017/K1/10X"
    - "02.06/2017/K1/1X"
    - "06.01/2014/K1/1X"
    - "06.01/2014/K1/10X"
    - "27.02/2017/K1/1X"
    - "27.02/2017/K1/10X"
    - "27.03/2014/K1/1X"
    - "27.03/2014/K1/10X"
  folds: 3

model:
  name: "facebook/deit-tiny-patch16-224"
  freeze_backbone: true

training:
  epochs: 2
  patience: 3
  batch_size: 32
  learning_rate: 0.001
  weight_decay: 0.01
  seed: 42
  device: "cuda"

performance:
  num_workers: 4
  pin_memory: true
  persistent_workers: true
  prefetch_factor: 2
  mixed_precision: "fp16"

output:
  model_dir: "magnification_model"