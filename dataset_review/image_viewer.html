<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Dataset image viewer</title>
<style>
body { margin: 12px; font: 14px system-ui, sans-serif; }
form, nav { display: flex; gap: 8px; align-items: center; flex-wrap: wrap; margin-bottom: 8px; }
#folder { min-width: 260px; }
button, select, #folder { padding: 6px; }
#gallery { display: grid; grid-template-columns: repeat(var(--columns, 1), minmax(0, 1fr)); gap: 8px; }
.tile { border: 2px solid transparent; padding: 4px; overflow-wrap: anywhere; cursor: pointer; }
.tile:has(input:checked) { border-color: #2684ff; }
.tile img { display: block; width: 100%; height: 36vh; object-fit: contain; }
#gallery[data-size="1"] img { height: 76vh; }
@media (max-width: 700px) {
  #gallery[data-size="8"] { grid-template-columns: repeat(2, minmax(0, 1fr)); }
}
#message { min-height: 20px; white-space: pre-wrap; }
</style>
</head>
<body>
<form id="folder-form">
<label>Folder <input id="folder" value="." placeholder="Station or subfolder within the dataset"></label>
<button id="load" type="submit">Load folder</button>
<span id="root"></span>
</form>
<nav aria-label="Image controls">
<label>Images per page <select id="page-size">
<option value="1">1</option><option value="4">4</option><option value="8">8</option>
</select></label>
<button id="previous" type="button" aria-keyshortcuts="ArrowLeft" disabled>Previous</button>
<button id="next" type="button" aria-keyshortcuts="ArrowRight" disabled>Next</button>
<span id="position">0 / 0</span>
<button id="bad" type="button" disabled>Send to bad_images</button>
<button id="one" type="button" disabled>Move to 1X</button>
<button id="ten" type="button" disabled>Move to 10X</button>
<button id="k1" type="button" disabled>Move to K1</button>
<button id="k2" type="button" disabled>Move to K2</button>
<button id="undo" type="button" disabled>Undo last move</button>
</nav>
<div id="gallery" role="group" aria-label="Select an image"></div>
<p id="message" role="status"></p>
<script>
const token = "__VIEWER_TOKEN__";
const element = id => document.getElementById(id);
let images = [];
let index = 0;
let busy = false;
let loadedFolder = ".";
let lastMoveId = null;
const pageSize = () => Number(element("page-size").value);
const pageStart = () => Math.floor(index / pageSize()) * pageSize();

function controls() {
  const current = images[index];
  element("load").disabled = busy;
  element("folder").disabled = busy;
  element("page-size").disabled = busy;
  element("previous").disabled = busy || pageStart() === 0 || !current;
  element("next").disabled = busy || pageStart() + pageSize() >= images.length;
  element("bad").disabled = busy || !current;
  element("one").disabled = busy || !current || current.magnification !== "10X";
  element("ten").disabled = busy || !current || current.magnification !== "1X";
  element("k1").disabled = busy || !current || current.camera !== "K2";
  element("k2").disabled = busy || !current || current.camera !== "K1";
  element("undo").disabled = busy || !lastMoveId;
  for (const input of element("gallery").querySelectorAll("input")) input.disabled = busy;
}

function display() {
  const gallery = element("gallery");
  const start = pageStart();
  const size = pageSize();
  const end = Math.min(start + size, images.length);
  gallery.dataset.size = size;
  gallery.style.setProperty("--columns", {1: 1, 4: 2, 8: 4}[size]);
  gallery.replaceChildren();
  element("position").textContent = images.length ? (start + 1) + "–" + end + " / " + images.length : "0 / 0";
  if (!images.length) gallery.textContent = "No images in this folder.";
  for (let i = start; i < end; i++) {
    const current = images[i];
    const tile = document.createElement("label");
    tile.className = "tile";
    const select = document.createElement("input");
    select.type = "radio";
    select.name = "selected-image";
    select.checked = i === index;
    select.onchange = () => { index = i; controls(); };
    const preview = document.createElement("img");
    preview.alt = current.name;
    preview.onerror = () => { preview.alt = "Preview unavailable · " + current.name; };
    preview.src = "/image?id=" + encodeURIComponent(current.id);
    tile.append(select, document.createTextNode(current.path), preview);
    gallery.append(tile);
  }
  controls();
}

async function request(url, options) {
  const response = await fetch(url, options);
  const body = await response.json();
  if (!response.ok) throw new Error(body.error || response.statusText);
  return body;
}

async function loadFolder(event) {
  if (event) event.preventDefault();
  if (busy) return;
  busy = true;
  controls();
  element("message").textContent = "Loading images…";
  try {
    const folder = element("folder").value || ".";
    const body = await request("/api/images?folder=" + encodeURIComponent(folder));
    loadedFolder = folder;
    images = body.images;
    index = 0;
    element("root").textContent = body.root;
    element("message").textContent = "";
    display();
  } catch (error) {
    element("message").textContent = error.message;
  } finally {
    busy = false;
    controls();
  }
}

function post(endpoint, payload) {
  return request(endpoint, {
    method: "POST",
    headers: {"Content-Type": "application/json", "X-Viewer-Token": token},
    body: JSON.stringify(payload)
  });
}

async function move(action) {
  if (busy || !images[index]) return;
  busy = true;
  controls();
  element("message").textContent = "Moving image…";
  try {
    const id = images[index].id;
    const body = await post("/api/move", {id, action});
    lastMoveId = id;
    images.splice(index, 1);
    index = Math.max(0, Math.min(index, images.length - 1));
    display();
    element("message").textContent = "Moved to " + body.destination;
  } catch (error) {
    element("message").textContent = error.message;
  } finally {
    busy = false;
    controls();
  }
}

async function undo() {
  if (busy || !lastMoveId) return;
  busy = true;
  controls();
  element("message").textContent = "Restoring image…";
  try {
    const {restored} = await post("/api/undo", {id: lastMoveId});
    lastMoveId = null;
    element("message").textContent = "Restored " + restored;
    try {
      const body = await request("/api/images?folder=" + encodeURIComponent(loadedFolder));
      images = body.images;
      const restoredIndex = images.findIndex(image => image.path === restored);
      index = restoredIndex >= 0 ? restoredIndex : Math.max(0, Math.min(index, images.length - 1));
      display();
    } catch (error) {
      element("message").textContent += ". Reload the folder to refresh the list. " + error.message;
    }
  } catch (error) {
    element("message").textContent = error.message;
  } finally {
    busy = false;
    controls();
  }
}

function navigate(direction) {
  index = pageStart() + direction * pageSize();
  element("message").textContent = "";
  display();
}

element("folder-form").addEventListener("submit", loadFolder);
element("page-size").onchange = display;
element("previous").onclick = () => navigate(-1);
element("next").onclick = () => navigate(1);
document.addEventListener("keydown", event => {
  if (event.defaultPrevented || event.isComposing || event.altKey || event.ctrlKey || event.metaKey || event.shiftKey
      || event.target.closest("input, textarea, select") || event.target.isContentEditable) return;
  const buttonId = {ArrowLeft: "previous", ArrowRight: "next"}[event.key];
  if (!buttonId) return;
  event.preventDefault();
  element(buttonId).click();
});
element("bad").onclick = () => move("bad");
element("one").onclick = () => move("1X");
element("ten").onclick = () => move("10X");
element("k1").onclick = () => move("K1");
element("k2").onclick = () => move("K2");
element("undo").onclick = undo;
loadFolder();
</script>
</body>
</html>
